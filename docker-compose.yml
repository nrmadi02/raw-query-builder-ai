services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      python-backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      # ── Database (remote, not in Docker) ──
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_QUERY_URL=${DATABASE_QUERY_URL}
      # ── Better Auth ──
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - NEXT_PUBLIC_BETTER_AUTH_URL=${NEXT_PUBLIC_BETTER_AUTH_URL}
      # ── Google OAuth ──
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # ── AI Providers ──
      - LITELLM_URL=${LITELLM_URL:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL:-}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-glm-5-turbo}
      # ── Backend ──
      - PYTHON_BACKEND_URL=http://python-backend:8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    environment:
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL:-https://api.z.ai/api/coding/paas/v4}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-glm-5-turbo}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
